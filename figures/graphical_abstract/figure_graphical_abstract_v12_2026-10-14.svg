<svg viewBox="0 0 590 236" width="208.1mm" height="83.3mm" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Auditing agent-generated biomedical code with executable contracts</title>
  <desc>Left, the work in four steps, once: (1) build and freeze, an agent-written A2A receptor screen of an expanded library, 497 docked, 3 met the original two-part rule; (2) audit; (3) correct, once, human-approved and pre-registered, returning to the SNP-Lib, 236, 69, 15, then 8 compounds; (4) report as persistence, 3 of the 15 selected compounds persist under every choice tested, which is not a prediction of activity. Right, the audit as three questions. Do the checks catch planted errors? Of 128 planted errors, the contract checks caught 124 with the benchmark's check set and 101 as deployed, and a simple file-comparison test caught 128. What lies outside the written checks? Errors written blind to the project were caught in 1 of 5 cases in a first round and in 3 of 6 evaluable cases in a second round, and rewriting the same molecules as equivalent SMILES strings changed 25 of 25 docking scores. Is the final selection stable? Of 5,000 compounds, 72 passed one filter in the released run; over 200 reorderings of the same data the number ranged from 6 to 4,119 (median 1,004).</desc>
