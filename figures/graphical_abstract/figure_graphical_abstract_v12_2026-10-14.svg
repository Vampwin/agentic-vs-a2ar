  <rect x="13" y="87" width="202" height="34" rx="2.5" fill="#EEF2EE" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="20" y="97.8" font-size="8.8" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="start">2  Audit</text>
  <text x="20" y="107.6" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">checks against planted and blind errors, rewritten</text>
  <text x="20" y="116.4" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">molecules and reordered data (the three panels at right)</text>
  <line x1="114" y1="121.4" x2="114" y2="128.6" stroke="#6E7C74" stroke-width="0.7" marker-end="url(#a)"/>
  <rect x="13" y="129" width="202" height="34" rx="2.5" fill="#EEF2EE" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="20" y="139.8" font-size="8.8" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="start">3  Correct, once</text>
  <text x="20" y="149.6" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">human-approved, each pre-registered and tested;</text>
  <text x="20" y="158.4" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">back to the SNP-Lib: 236, 69, 15, then 8 compounds</text>
