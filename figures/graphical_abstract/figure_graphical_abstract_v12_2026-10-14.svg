  <text x="20" y="55.8" font-size="8.8" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="start">1  Build and freeze</text>
  <text x="20" y="65.6" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">an agent-written screen of an expanded library:</text>
  <text x="20" y="74.4" font-size="7.4" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="start">497 docked, 3 met the original two-part rule</text>
