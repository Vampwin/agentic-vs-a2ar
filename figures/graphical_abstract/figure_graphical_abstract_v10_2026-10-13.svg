<svg viewBox="0 0 590 236" width="208.1mm" height="83.3mm" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Auditing agent-generated biomedical code with executable contracts</title>
  <desc>Left, the frozen screening run, an agent-written A2A receptor virtual screen drawn as a funnel: 25,604 compounds, 21,882 after filters, 8,000 after a 2D pharmacophore screen, 5,000 after 3D refinement, 500 selected for full docking, 497 completed, 482 on pocket, 3 met the original two-part rule. Right, three questions about the audit of that workflow. Do the checks catch planted errors? Of 128 planted errors, the contract checks caught 124 with the benchmark's check set and 101 as deployed, and a simple file-comparison test caught 128. What lies outside the written checks? One of 5 independently written errors was caught, and rewriting the same molecules as equivalent SMILES strings changed 25 of 25 docking scores. Is the final selection stable? Of 5,000 compounds, 72 passed one filter in the released run; over 200 reorderings of the same training data the number ranged from 6 to 4,119 (median 1,004).</desc>
