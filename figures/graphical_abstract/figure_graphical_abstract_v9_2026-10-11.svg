<svg viewBox="0 0 590 236" width="208.1mm" height="83.3mm" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Auditing agent-generated biomedical code with executable contracts</title>
  <desc>Left, the frozen screening run, an agent-written A2A receptor virtual screen drawn as a funnel: 25,604 compounds, 21,882 after filters, 8,000 after a 2D pharmacophore screen, 5,000 after 3D refinement, 500 selected for full docking, 497 completed, 482 on pocket, 3 released by the original rule. Right, three layers of evaluation of that workflow. Contract coverage: of 128 seeded faults in 11 of 18 fault families, 124 were detected under the benchmark's harness contract and 101 under the contracts as deployed; a snapshot comparator detected all 128. Beyond the written contracts: 1 of 5 held-out faults was detected and equivalent SMILES changed 25 of 25 docking scores. Decision stability, a re-analysis of the ligand-based step: 72 of 5,000 compounds were eligible in the released run against 6 to 4,119 over 200 orders of the training rows.</desc>
