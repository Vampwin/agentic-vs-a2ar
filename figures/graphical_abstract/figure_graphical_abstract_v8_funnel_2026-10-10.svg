<svg viewBox="0 0 511 232" width="180.3mm" height="81.8mm" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Auditing agent-generated biomedical code with executable contracts</title>
  <desc>Left, the agent-written A2A receptor virtual screen as a funnel: 25,604 candidates, 21,882 after filters, 8,000 after a 2D pharmacophore screen, 5,000 after 3D refinement, 500 selected for full docking, 497 completed, 482 on pocket, 3 released by the original rule. Right, three layers of control applied to that workflow: ten contracts detected 124 of 128 seeded faults, where deterministic snapshots detected all 128; 1 of 5 blind-authored faults was detected and the SMILES-invariance relation identified a defect; and the number of eligible compounds of 5,000 was 72 in the released run against a median of 1,004 over 200 reorderings of the training rows.</desc>
  <rect x="0" y="0" width="511" height="232" fill="#FFFFFF"/>
