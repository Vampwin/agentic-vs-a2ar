<svg viewBox="0 0 511 206" width="180.3mm" height="72.7mm" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Executable verification of agent-generated code in an A2A receptor virtual-screening workflow</title>
  <desc>Three panels: deterministic contracts detect 124 of 128 seeded defects within eleven predefined fault families; an unencoded metamorphic relation and five blind-authored cases expose failures outside that coverage; and the A2AR screen is reported as an exploratory case study whose three compounds are computational hypotheses.</desc>
  <rect x="0" y="0" width="511" height="206" fill="#FFFFFF"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#6E7C74"/></marker></defs>
  <text x="255.5" y="15" font-size="11" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="middle">Executable verification of agent-generated code</text>
  <rect x="3" y="26" width="155" height="146" rx="3" fill="#FFFFFF" stroke="#4F7130" stroke-width="0.9"/>
  <rect x="3" y="26" width="155" height="15" rx="3" fill="#E7EEDC" stroke="#4F7130" stroke-width="0.9"/>
  <text x="11" y="36.5" font-size="7.4" fill="#4F7130" font-weight="bold" font-style="normal" text-anchor="start">1  Verification is the result</text>
  <text x="80.5" y="68" font-size="19" fill="#4F7130" font-weight="bold" font-style="normal" text-anchor="middle">96.9 %</text>
  <text x="80.5" y="79" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">124 of 128 seeded defects</text>
  <text x="80.5" y="88.2" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">caught by 94 deterministic checks</text>
  <line x1="15" y1="96" x2="146" y2="96" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="80.5" y="107" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">Wilson 95 % CI 92.2-98.8 %</text>
  <text x="80.5" y="117.224" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">0 false escalations of 55 clean</text>
  <text x="80.5" y="127.448" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">learned monitor adds nothing</text>
  <line x1="15" y1="134" x2="146" y2="134" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="80.5" y="145" font-size="7.4" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="middle">Measured, not assumed.</text>
  <text x="80.5" y="154" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">Ten contracts, nine gates,</text>
  <text x="80.5" y="162.96" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">eleven implemented families.</text>
  <line x1="161" y1="99" x2="175" y2="99" stroke="#6E7C74" stroke-width="0.9" marker-end="url(#a)"/>
  <rect x="178" y="26" width="155" height="146" rx="3" fill="#FFFFFF" stroke="#A85C18" stroke-width="0.9"/>
  <rect x="178" y="26" width="155" height="15" rx="3" fill="#F7E9D8" stroke="#A85C18" stroke-width="0.9"/>
  <text x="186" y="36.5" font-size="7.4" fill="#A85C18" font-weight="bold" font-style="normal" text-anchor="start">2  Coverage is the limit</text>
  <text x="255.5" y="68" font-size="19" fill="#A85C18" font-weight="bold" font-style="normal" text-anchor="middle">1 of 5</text>
  <text x="255.5" y="79" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">blind-authored cases detected;</text>
  <text x="255.5" y="88.2" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">three exposed evaluator gaps</text>
  <line x1="190" y1="96" x2="321" y2="96" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="255.5" y="107" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">all 94 checks had passed</text>
  <text x="255.5" y="117.224" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">one metamorphic relation failed</text>
  <text x="255.5" y="127.448" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">G2, G3, G5, G7 carry no family</text>
  <line x1="190" y1="134" x2="321" y2="134" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="255.5" y="145" font-size="7.4" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="middle">Contracts outran evaluators.</text>
  <text x="255.5" y="154" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">Detection holds inside the</text>
  <text x="255.5" y="162.96" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">families it was measured over.</text>
  <line x1="336" y1="99" x2="350" y2="99" stroke="#6E7C74" stroke-width="0.9" marker-end="url(#a)"/>
  <rect x="353" y="26" width="155" height="146" rx="3" fill="#FFFFFF" stroke="#2C5F8A" stroke-width="0.9"/>
  <rect x="353" y="26" width="155" height="15" rx="3" fill="#E3EBF3" stroke="#2C5F8A" stroke-width="0.9"/>
  <text x="361" y="36.5" font-size="7.4" fill="#2C5F8A" font-weight="bold" font-style="normal" text-anchor="start">3  The screen is exploratory</text>
  <text x="430.5" y="68" font-size="19" fill="#2C5F8A" font-weight="bold" font-style="normal" text-anchor="middle">3</text>
  <text x="430.5" y="79" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">compounds met a prespecified</text>
  <text x="430.5" y="88.2" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">dual-criterion rule</text>
  <line x1="365" y1="96" x2="496" y2="96" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="430.5" y="107" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">0 % in-domain, 64.4 % physchem</text>
  <text x="430.5" y="117.224" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">AUC 0.601 vs 0.584 heavy atoms</text>
  <text x="430.5" y="127.448" font-size="7.2" fill="#55625B" font-weight="normal" font-style="normal" text-anchor="middle">joint count is what chance gives</text>
  <line x1="365" y1="134" x2="496" y2="134" stroke="#9AA79F" stroke-width="0.6"/>
  <text x="430.5" y="145" font-size="7.4" fill="#1B2420" font-weight="bold" font-style="normal" text-anchor="middle">Computational hypotheses.</text>
  <text x="430.5" y="154" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">No assay was performed; no</text>
  <text x="430.5" y="162.96" font-size="7" fill="#55625B" font-weight="normal" font-style="italic" text-anchor="middle">binding or native pose shown.</text>
  <text x="255.5" y="190" font-size="7.6" fill="#1B2420" font-weight="normal" font-style="normal" text-anchor="middle">Contract coverage, applicability domain and scientific validation are three different quantities.</text>
</svg>
